<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" role="img" aria-label="SatQuery AI animated radar hero" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="1" stop-color="#0a1c2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#4dffb8"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00e5ff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>
  <rect width="900" height="300" rx="18" fill="url(#grid)"/>

  <!-- radar -->
  <g transform="translate(160 150)">
    <circle r="112" fill="#04101c" stroke="#00e5ff" stroke-opacity="0.5"/>
    <circle r="75" fill="none" stroke="#00e5ff" stroke-opacity="0.3"/>
    <circle r="38" fill="none" stroke="#00e5ff" stroke-opacity="0.3"/>
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#00e5ff" stroke-opacity="0.25"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#00e5ff" stroke-opacity="0.25"/>

    <!-- rotating sweep wedge -->
    <g>
      <path d="M0,0 L0,-112 A112,112 0 0 1 72,-86 Z" fill="url(#sweep)" transform="rotate(-40)"/>
      <line x1="0" y1="0" x2="0" y2="-112" stroke="#4dffb8" stroke-width="2" stroke-opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- detected targets -->
    <g fill="#ffb020">
      <circle cx="-52" cy="-40" r="4">
        <animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="-62" r="4">
        <animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="68" cy="22" r="4">
        <animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-30" cy="58" r="4">
        <animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-78" cy="18" r="4">
        <animate attributeName="opacity" values="1;0.15;1" dur="5s" begin="3.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- pulse rings on one target -->
    <circle cx="40" cy="-62" r="4" fill="none" stroke="#ffb020">
      <animate attributeName="r" values="4;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#00e5ff" fill-opacity="0.8">11 TARGETS · GSD 0.28 m</text>
  </g>

  <!-- title block -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="340" y="112" font-size="56" font-weight="800" fill="url(#title)">SatQuery AI</text>
    <text x="342" y="146" font-size="19" fill="#dff6ff">Ask your satellite imagery anything.</text>
  </g>

  <!-- telemetry lines -->
  <g font-family="Consolas, monospace" font-size="14">
    <text x="342" y="186" fill="#00e5ff" opacity="0">
      ▸ parsing intent…
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="8s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="342" y="212" fill="#00e5ff" opacity="0">
      ▸ routing → YOLOv8 · change engine · spectral indices
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.28;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="342" y="238" fill="#4dffb8" opacity="0">
      ▸ 11 vessels located · confidence 95.8 % · grounded
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.53;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="342" y="264" fill="#ffb020" opacity="0">
      ▸ dossier ready · export PDF / GeoJSON / CSV
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.76;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
