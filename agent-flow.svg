<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="SatQuery AI agent pipeline: ask, validate, orchestrate, specialist models, evidence-grounded answer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="1" stop-color="#0a1c2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#4dffb8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">question → AI agent → specialist models → evidence → answer</text>

  <!-- track -->
  <line x1="20" y1="130" x2="880" y2="130" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <line x1="20" y1="130" x2="880" y2="130" stroke="url(#line)" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="2s" repeatCount="indefinite"/>
  </line>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- 1 Ask -->
    <rect x="20" y="80" width="130" height="100" rx="14" fill="#07131f" stroke="#00e5ff" stroke-opacity="0.6"/>
    <rect x="20" y="80" width="130" height="100" rx="14" fill="#00e5ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.026;0.076;0.136;1" dur="8.6s" repeatCount="indefinite"/>
    </rect>
    <text x="85" y="118" font-size="26">💬</text>
    <text x="85" y="145" font-size="14" font-weight="700" fill="#fff">Ask</text>
    <text x="85" y="163" font-size="10.5" fill="#9fd6e6">plain-language query</text>

    <!-- 2 Validate -->
    <rect x="190" y="80" width="130" height="100" rx="14" fill="#07131f" stroke="#00e5ff" stroke-opacity="0.6"/>
    <rect x="190" y="80" width="130" height="100" rx="14" fill="#00e5ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.223;0.273;0.333;1" dur="8.6s" repeatCount="indefinite"/>
    </rect>
    <text x="255" y="118" font-size="26">🛰️</text>
    <text x="255" y="145" font-size="14" font-weight="700" fill="#fff">Validate</text>
    <text x="255" y="163" font-size="10.5" fill="#9fd6e6">format · CRS · GSD · dates</text>

    <!-- 3 Orchestrate -->
    <rect x="360" y="80" width="130" height="100" rx="14" fill="#07131f" stroke="#4dffb8" stroke-opacity="0.8"/>
    <rect x="360" y="80" width="130" height="100" rx="14" fill="#4dffb8" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.421;0.471;0.531;1" dur="8.6s" repeatCount="indefinite"/>
    </rect>
    <text x="425" y="118" font-size="26">🧠</text>
    <text x="425" y="145" font-size="14" font-weight="700" fill="#fff">Orchestrate</text>
    <text x="425" y="163" font-size="10.5" fill="#9fe8c8">intent → tool-calling DAG</text>

    <!-- 4 Specialists -->
    <rect x="530" y="58" width="190" height="144" rx="14" fill="#07131f" stroke="#00e5ff" stroke-opacity="0.6"/>
    <rect x="530" y="58" width="190" height="144" rx="14" fill="#00e5ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.3;0;0" keyTimes="0;0.653;0.703;0.763;1" dur="8.6s" repeatCount="indefinite"/>
    </rect>
    <text x="625" y="80" font-size="12" font-weight="700" fill="#fff">Specialist models</text>

    <g font-size="11" fill="#dff6ff">
      <rect x="542" y="90" width="82" height="46" rx="8" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.5"/>
      <text x="583" y="110" font-weight="700">Detect</text>
      <text x="583" y="125" font-size="9.5" fill="#9fd6e6">YOLOv8</text>
      <rect x="542" y="90" width="82" height="46" rx="8" fill="#00e5ff" opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.66;0.69;0.73;1" dur="8.6s" repeatCount="indefinite"/>
      </rect>

      <rect x="636" y="90" width="72" height="46" rx="8" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.5"/>
      <text x="672" y="110" font-weight="700">Compare</text>
      <text x="672" y="125" font-size="9.5" fill="#9fd6e6">SSIM+CVA</text>
      <rect x="636" y="90" width="72" height="46" rx="8" fill="#00e5ff" opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.68;0.71;0.75;1" dur="8.6s" repeatCount="indefinite"/>
      </rect>

      <rect x="542" y="146" width="82" height="46" rx="8" fill="#4dffb8" fill-opacity="0.12" stroke="#4dffb8" stroke-opacity="0.5"/>
      <text x="583" y="166" font-weight="700">Segment</text>
      <text x="583" y="181" font-size="9.5" fill="#9fe8c8">NDWI · NDVI</text>
      <rect x="542" y="146" width="82" height="46" rx="8" fill="#4dffb8" opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.70;0.73;0.77;1" dur="8.6s" repeatCount="indefinite"/>
      </rect>

      <rect x="636" y="146" width="72" height="46" rx="8" fill="#4dffb8" fill-opacity="0.12" stroke="#4dffb8" stroke-opacity="0.5"/>
      <text x="672" y="166" font-weight="700">Fuse</text>
      <text x="672" y="181" font-size="9.5" fill="#9fe8c8">Optical+SAR</text>
      <rect x="636" y="146" width="72" height="46" rx="8" fill="#4dffb8" opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.72;0.75;0.79;1" dur="8.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 5 Evidence -->
    <rect x="760" y="80" width="120" height="100" rx="14" fill="#07131f" stroke="#ffb020" stroke-opacity="0.8"/>
    <rect x="760" y="80" width="120" height="100" rx="14" fill="#ffb020" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.88;0.93;0.985;1" dur="8.6s" repeatCount="indefinite"/>
    </rect>
    <text x="820" y="118" font-size="26">📄</text>
    <text x="820" y="145" font-size="14" font-weight="700" fill="#fff">Evidence</text>
    <text x="820" y="163" font-size="10.5" fill="#ffd58a">answer · map · dossier</text>
  </g>

  <!-- pulse -->
  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="8.6s" repeatCount="indefinite" path="M20,130 L880,130"/>
  </circle>

  <text x="450" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9fd6e6">Every answer ships with its tools, confidence, uncertainty and a model trail you can inspect</text>
</svg>
